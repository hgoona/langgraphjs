version: "3.8"

services:
  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: langgraphjs-surrealdb-test
    environment:
      SURREALDB_DATABASE: testdb
      SURREALDB_USER: user
      SURREALDB_PASSWORD: password
    ports:
      - "8000:8000"
    volumes:
      - surrealdb_data:/var/lib/surrealdb

volumes:
  surrealdb_data: